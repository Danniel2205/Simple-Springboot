services:
  postgres:
    image: postgres:18
    container_name: day2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: belajar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d belajar_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
